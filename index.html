<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>重賞展開予報</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7614859276901999" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 競馬新聞の馬柱のように、黙って数字を並べる。断定しない、煽らない。
   IDEA: 天気予報のように「展開」を予報する。ペースは確率、隊列は図、期待値は計算機。
   PICTURE: レースごとの隊列図（内ラチを上、進行方向を右）。色は枠色だけ。
   COLOUR and TYPE: 白と黒。色はJRAの枠色8色のみ（意味を持つ色）。和文 BIZ UDPゴシック、数字 Barlow Semi Condensed。
   LAYOUT: 左に今週の重賞の時刻表、右に選んだレース。予想表の右に期待値計算が付いてくる。スマホは縦一列。 */
:root{color-scheme:light dark;
 --bg:light-dark(#ffffff,#000000);--ink:light-dark(#000000,#f2f2f2);--sub:light-dark(#5c5c5c,#a8a8a8);
 --rule:light-dark(#e2e2e2,#2b2b2b);--soft:light-dark(#f3f3f3,#141414);--strong:light-dark(#000000,#ffffff);--inv:light-dark(#ffffff,#000000);
 --g1:#ffffff;--g2:#000000;--g3:#e3342f;--g4:#1f5fc9;--g5:#f4cf0c;--g6:#1c9a4a;--g7:#ef861b;--g8:#f19ab4;
 --num:"Barlow Semi Condensed","BIZ UDPGothic",sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "BIZ UDPGothic",system-ui,sans-serif;overflow-x:clip;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
a{color:inherit}
:focus-visible{outline:2px solid var(--strong);outline-offset:2px}

/* 上の帯 */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:2px solid var(--strong);display:flex;align-items:center;gap:16px;padding:10px max(3vw,16px);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:.04em}
.brand svg{width:26px;height:26px}
.top .meta{margin-left:auto;color:var(--sub);font-size:13px;display:flex;gap:14px;flex-wrap:wrap}
.top .meta b{color:var(--ink);font-weight:700}

/* 骨組み */
.wrap{display:grid;grid-template-columns:260px minmax(0,1fr);max-width:1480px;margin:0 auto}
.rail{border-right:1px solid var(--rule);padding:22px 0;position:sticky;top:52px;align-self:start;max-height:calc(100vh - 52px);overflow:auto}
.rail h2{font-size:13px;color:var(--sub);font-weight:400;margin:0 22px 10px}
.day{margin:0 0 6px}
.day>div{font-size:13px;color:var(--sub);padding:12px 22px 4px}
.rbtn{display:grid;grid-template-columns:62px 1fr;gap:2px 10px;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;padding:10px 18px;cursor:pointer;min-height:44px}
.rbtn:hover{background:var(--soft)}
.rbtn[aria-current=true]{border-left-color:var(--strong);background:var(--soft)}
.rbtn .t{font-family:var(--num);font-size:26px;font-weight:600;line-height:1;grid-row:span 2}
.rbtn .nm{font-weight:700;line-height:1.3}
.rbtn .sm{font-size:12px;color:var(--sub)}
.gr{display:inline-block;font-family:var(--num);font-weight:700;font-size:12px;border:1.5px solid currentColor;padding:0 5px;border-radius:3px;margin-left:6px;vertical-align:2px;line-height:1.35}
.gr.G1{background:var(--strong);color:var(--inv);border-color:var(--strong)}
main{padding:0 max(3vw,16px) 80px}
section{padding:34px 0;border-bottom:1px solid var(--rule)}
section:last-child{border-bottom:0}
h3{display:flex;align-items:center;gap:10px;font-size:20px;margin:0 0 6px;line-height:1.3}
.lead{color:var(--sub);margin:0 0 20px;max-width:68ch;font-size:15px}

/* レースの見出し */
.head{padding:30px 0 26px}
.head h1{font-size:clamp(32px,4.6vw,52px);line-height:1.05;margin:0 0 14px;letter-spacing:.01em;text-wrap:balance}
.head h1 .gr{font-size:.38em;vertical-align:.5em}
.facts{display:flex;flex-wrap:wrap;gap:6px 26px;font-size:15px}
.facts span{display:flex;gap:7px;align-items:baseline}
.facts small{color:var(--sub);font-size:12px}
.facts .n{font-size:20px;font-weight:600}
.note{font-size:13px;color:var(--sub);margin-top:12px}
.flag{display:inline-flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--strong);padding:3px 9px;border-radius:999px;margin-top:14px}

/* 展開 */
.pace{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:28px;align-items:start}
.fc{border-top:2px solid var(--strong);padding-top:12px}
.fc .big{font-size:34px;font-weight:700;line-height:1.1}
.fc .why{color:var(--sub);font-size:14px;margin:6px 0 14px}
.seg{display:flex;height:34px;border:1.5px solid var(--strong);border-radius:4px;overflow:hidden}
.seg div{display:flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:600;font-size:14px;border-right:1.5px solid var(--strong);white-space:nowrap;overflow:hidden}
.seg div:last-child{border-right:0}
.seg .H{background:var(--strong);color:var(--inv)}.seg .M{background:var(--soft)}
.segl{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:6px}
.strip-tools{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.tog{display:inline-flex;border:1.5px solid var(--strong);border-radius:6px;overflow:hidden}
.tog button{background:none;border:0;padding:8px 14px;min-height:40px;cursor:pointer;font-size:14px}
.tog button[aria-pressed=true]{background:var(--strong);color:var(--inv)}
.tog.wrap{flex-wrap:wrap;display:grid;grid-template-columns:repeat(3,1fr)}.tog button:disabled{opacity:.35;cursor:not-allowed}.tog.wrap button{padding:8px 6px}
.combos.all{max-height:none}
.strip-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.strip{position:relative;min-width:620px;height:300px}
.strip svg{position:absolute;inset:0;width:100%;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--sub);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--strong);vertical-align:-2px;margin-right:5px}
.legend i.dash{border-style:dashed}

/* 予想表＋計算 */
.board{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start}
.tbl-scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:400;color:var(--sub);font-size:12px;text-align:left;padding:8px 6px;border-bottom:1.5px solid var(--strong);white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid var(--rule);vertical-align:middle}
td.r,th.r{text-align:right}
tr.h{cursor:pointer}
tr.h:hover td{background:var(--soft)}
tr.h[aria-expanded=true] td{background:var(--soft);border-bottom-color:transparent}
th button{background:none;border:0;padding:0;color:inherit;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:3px}
th button[aria-sort]{color:var(--ink);font-weight:700}
.gate{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;font-family:var(--num);font-weight:700;font-size:15px;border:1.5px solid var(--strong);border-radius:4px}
.w1{background:var(--g1);color:#000}.w2{background:var(--g2);color:#fff;border-color:light-dark(#000,#888)}.w3{background:var(--g3);color:#fff}.w4{background:var(--g4);color:#fff}
.w5{background:var(--g5);color:#000}.w6{background:var(--g6);color:#fff}.w7{background:var(--g7);color:#000}.w8{background:var(--g8);color:#000}.w0{background:var(--soft);color:var(--ink);border-style:dashed}
.nm b{display:block;font-size:15px;line-height:1.3}
.nm small{color:var(--sub);font-size:12px}
.mark{font-size:18px;font-weight:700;width:22px;text-align:center}
.pbar{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.pbar span{display:block;height:6px;background:var(--strong);border-radius:3px}
.odds{width:66px;text-align:right;font-family:var(--num);font-size:16px;padding:6px 6px;border:1px solid var(--rule);border-radius:4px;background:var(--bg)}
.odds.edited{border-color:var(--strong);border-width:1.5px}
.ev{font-family:var(--num);font-weight:700;font-size:16px;white-space:nowrap}
.ev.hi{background:var(--strong);color:var(--inv);padding:2px 6px;border-radius:3px}
.det td{padding:0 6px 18px;background:var(--soft)}
.detg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 28px;padding:6px 4px 0;font-size:13px}
.detg h4{margin:4px 0 6px;font-size:13px;display:flex;gap:6px;align-items:center}
.fac{list-style:none;margin:0;padding:0}
.fac li{display:flex;gap:8px;padding:3px 0;border-bottom:1px dotted var(--rule)}
.fac li b{font-family:var(--num);min-width:42px;text-align:right}
.runs{width:100%;font-size:12px}
.runs td{padding:4px 4px;border-bottom:1px dotted var(--rule);background:none}
.sel{display:inline-flex;gap:4px}
.sel button{border:1.5px solid var(--rule);background:var(--bg);border-radius:4px;min-width:34px;min-height:34px;font-size:12px;cursor:pointer;padding:0 6px}
.sel button[aria-pressed=true]{background:var(--strong);color:var(--inv);border-color:var(--strong)}

.calc{position:sticky;top:70px;border:2px solid var(--strong);border-radius:8px;padding:18px}
.calc h3{font-size:18px}
.calc label{font-size:13px;color:var(--sub);display:block;margin:12px 0 4px}
.calc .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.calc input[type=number]{width:110px;font-family:var(--num);font-size:18px;padding:8px;border:1.5px solid var(--strong);border-radius:4px;background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{width:38px;height:38px;border:1.5px solid var(--rule);border-radius:4px;background:var(--bg);font-family:var(--num);font-weight:600;font-size:15px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--strong);color:var(--inv);border-color:var(--strong)}
.out{margin-top:16px;border-top:1.5px solid var(--strong);padding-top:12px}
.out .k{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.out .k .n{font-size:18px;font-weight:600;text-align:right}
.out .res{font-size:44px;font-family:var(--num);font-weight:700;line-height:1;margin:6px 0 2px}
.out .cap{font-size:12px;color:var(--sub)}
.combos{max-height:300px;overflow:auto;margin-top:12px;font-size:13px}
.combos table td{padding:5px 4px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--strong);background:var(--bg);border-radius:6px;padding:8px 12px;min-height:40px;cursor:pointer;font-size:14px}
.btn.solid{background:var(--strong);color:var(--inv)}
.warn{font-size:12px;color:var(--sub);margin-top:12px;line-height:1.5}

/* 有利不利 */
.bias{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:34px 48px}
.bias h4{font-size:15px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.bias p.s{margin:0 0 12px;font-size:12px;color:var(--sub)}
.bar{display:grid;grid-template-columns:58px minmax(0,1fr) 96px;align-items:center;gap:10px;padding:5px 0;font-size:13px}
.bar .track{position:relative;height:16px;background:var(--soft);border-radius:2px}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--strong);border-radius:2px}
.bar .avg{position:absolute;top:-3px;bottom:-3px;width:0;border-left:1.5px dashed var(--sub)}
.bar .v{text-align:right;font-family:var(--num);font-size:14px;white-space:nowrap}
.bar .v small{color:var(--sub);font-size:11px;margin-left:4px}
.bar.mine .lab{font-weight:700}
.mini th,.mini td{font-size:13px;padding:6px 5px}
.hist table td{font-size:13px}
.method{font-size:14px;color:var(--sub);max-width:76ch}
.method h4{color:var(--ink);font-size:15px;margin:22px 0 6px}
.bt td,.bt th{font-size:13px}
.empty{padding:60px 0;color:var(--sub)}


/* 追加：シナリオ・ヒートマップ・馬場・対戦・詳細 */
.scn td,.scn th{white-space:nowrap}
.scn td.r{min-width:120px}
.sb{height:5px;background:var(--soft);border-radius:3px;margin-bottom:3px;overflow:hidden}.sb span{display:block;height:100%;background:var(--strong)}
.scn b.top{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.scn small{color:var(--sub);margin-left:6px;font-size:11px}
.heat{width:auto;border-collapse:separate;border-spacing:2px}
.heat th,.heat td{padding:0;border:0;text-align:center}
.heat td.x{background:none}
.hc{width:40px;height:34px;border:0;border-radius:3px;font-family:var(--num);font-size:12px;cursor:pointer;color:var(--ink);padding:0}
.hc.on{outline:2.5px solid var(--strong);outline-offset:1px;font-weight:700}
.nowbox{border:1.5px solid var(--strong);border-radius:8px;padding:16px 18px;margin-bottom:30px}
.nowbox h4{display:flex;gap:8px;align-items:center;margin:0 0 4px;font-size:15px}
.nowbox .bias{margin-top:12px;gap:18px 40px}
.nowbox details{margin-top:12px;font-size:14px}.nowbox summary{cursor:pointer;min-height:36px;display:flex;align-items:center}
.fin{display:flex;flex-wrap:wrap;gap:4px 10px}.fin span{display:inline-flex;align-items:center;gap:3px}.fin small{font-size:11px;color:var(--sub)}
.fin span.me{outline:2px solid var(--strong);outline-offset:2px;border-radius:3px}
body.lock{overflow:hidden}
#drawer{position:fixed;inset:0;z-index:50}
#drawer[hidden]{display:none}
.dback{position:absolute;inset:0;background:color-mix(in srgb,#000 45%,transparent)}
.dpanel{position:absolute;top:0;right:0;bottom:0;width:min(980px,100%);background:var(--bg);overflow:auto;padding:22px clamp(16px,3vw,32px) 60px;border-left:2px solid var(--strong)}
.dhead{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start}
.dhead .gate{width:38px;height:38px;font-size:22px}
.dname h2{margin:0;font-size:clamp(24px,3.4vw,34px);line-height:1.15}
.dname p{margin:4px 0 0;font-size:14px}.dname .sub{color:var(--sub);font-size:13px}
.dclose{width:44px;height:44px;border:1.5px solid var(--strong);border-radius:6px;background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center}
.dkpi{display:flex;flex-wrap:wrap;gap:10px 26px;margin:18px 0 6px;padding:14px 0;border-top:2px solid var(--strong);border-bottom:1px solid var(--rule)}
.dkpi span{display:flex;flex-direction:column}.dkpi small{font-size:11px;color:var(--sub)}.dkpi b{font-size:22px;font-weight:600}.dkpi b.sc{font-size:15px}
.dkpi .evb{background:var(--strong);color:var(--inv);padding:0 6px;border-radius:3px}
.tabs{display:flex;gap:0;overflow-x:auto;border-bottom:1.5px solid var(--strong);margin:14px 0 16px}
.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;min-height:44px;cursor:pointer;font-size:14px;color:var(--sub)}
.tabs button[aria-selected=true]{border-bottom-color:var(--strong);color:var(--ink);font-weight:700}
.runs2{font-size:13px}.runs2 td,.runs2 th{white-space:nowrap;padding:7px 6px}
.rk{display:inline-flex;min-width:24px;height:24px;align-items:center;justify-content:center;border:1.5px solid var(--strong);border-radius:50%;font-family:var(--num);font-size:13px}
.rk.t3{background:var(--strong);color:var(--inv)}
.fit tr.cur td{font-weight:700}
@media(max-width:640px){.dpanel{border-left:0;padding-top:14px}.dkpi b{font-size:18px}.hc{width:34px;height:30px;font-size:11px}
 .runs2 thead{display:none}.runs2 tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--rule)}.runs2 td{border:0;padding:1px 0;white-space:normal;text-align:left!important}
 .runs2 td::before{content:attr(data-l)'　';color:var(--sub);font-size:11px}}

.fig{position:relative;min-height:260px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.mini td.n,.mini td.r{white-space:nowrap}
.scn small.up{color:var(--ink);font-weight:700}
.foot{border-top:2px solid var(--strong);padding:24px max(3vw,16px) 40px;display:flex;flex-wrap:wrap;gap:12px 40px;justify-content:space-between;font-size:13px;color:var(--sub);max-width:1480px;margin:0 auto}
.foot b{color:var(--ink);margin-right:10px}.foot nav{display:flex;gap:18px;flex-wrap:wrap}.foot a{color:var(--ink)}
.notebox{display:flex;flex-wrap:wrap;align-items:center;gap:14px 28px;margin-top:22px;padding:16px 18px;border:2px solid var(--strong);border-radius:8px}
.nb-l{flex:1 1 320px}.nb-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.nb-t{display:block;font-size:17px;line-height:1.4;margin:4px 0}.notebox p{margin:0;font-size:14px;color:var(--sub)}
.nb-btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 20px;background:var(--strong);color:var(--inv);border-radius:6px;text-decoration:none;font-weight:700;white-space:nowrap}
.nb-btn .n{font-weight:600;border-left:1px solid color-mix(in srgb,var(--inv) 40%,transparent);padding-left:10px}
.nb-btn:hover{opacity:.88}
.k2{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;align-items:end}.k2>div{display:flex;flex-direction:column}
.res.sm{font-size:28px!important}
.ana{display:inline-block;font-size:11px;border:1.5px solid var(--strong);border-radius:3px;padding:0 4px;font-weight:700;vertical-align:1px}
.sel2{font-size:16px;padding:8px 10px;border:1.5px solid var(--strong);border-radius:4px;background:var(--bg);min-height:44px}
.tori{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.6;margin:12px 0 0;padding:10px 12px;border:1.5px solid var(--strong);border-radius:6px}
.chk{display:flex!important;align-items:center;gap:8px;color:var(--ink)!important;font-size:14px!important;min-height:44px;cursor:pointer}.chk input{width:20px;height:20px}
tr.off td{color:var(--sub)}.neg{color:var(--ink);text-decoration:underline;text-decoration-style:wavy;text-underline-offset:3px}
.kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1.5px solid var(--strong);border-radius:6px;overflow:hidden;margin-top:10px}
.kinds button{background:none;border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);min-height:44px;font-size:13px;cursor:pointer;padding:6px 4px}
.kinds button[aria-pressed=true]{background:var(--strong);color:var(--inv);font-weight:700}
.kinds .hr{display:block;font-size:11px;font-weight:400;opacity:.8}
.k2.two{grid-template-columns:1fr 1fr}
.axisline{display:flex;flex-wrap:wrap;gap:8px 22px;margin:14px 0 4px;font-size:14px;align-items:center}.axisline small{display:block;font-size:11px;color:var(--sub)}
.frm{display:flex;flex-wrap:wrap;gap:8px 18px}.arr{color:var(--sub);font-size:12px;margin:0 1px}
.combos.tall{max-height:420px!important}
.combos .fin{flex-wrap:nowrap;gap:2px}.combos .fin .gate{width:22px;height:22px;font-size:13px}.combos td:first-child{white-space:nowrap}.combos td.r,.combos th.r{white-space:nowrap}.pt td,.pt th{padding:6px 3px}.combos td:first-child .fin{display:inline-flex}
.tog.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}.tog.modes button{padding:8px 6px}
/* 幅ごと */
@media(max-width:1280px){.board{grid-template-columns:minmax(0,1fr)}.calc{position:static}}
@media(max-width:980px){
 .wrap{grid-template-columns:minmax(0,1fr)}
 .top{position:static}
 .rail{position:sticky;top:0;z-index:15;background:var(--bg);border-right:0;border-bottom:1px solid var(--rule);padding:8px 0;max-height:none;display:flex;overflow-x:auto;scroll-snap-type:x mandatory}

/* ---- 確率の計算 ---- */
function norm(a){const s=a.reduce((x,y)=>x+y,0)||1;return a.map(x=>x/s)}
function trioMatrix(p){
 // 勝率 p から 3着内（順不同）の確率。2・3着は人気馬を割り引く補正（指数0.81, 0.65）
 p=norm(p);const q2=norm(p.map(x=>x**0.81)),q3=norm(p.map(x=>x**0.65)),n=p.length,out=new Map();
 for(let a=0;a<n;a++)for(let b=a+1;b<n;b++)for(let c=b+1;c<n;c++){
  const t=[a,b,c];let s=0;
  for(const[i,j,k]of[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]]){const I=t[i],J=t[j],K=t[k];const d2=1-q2[I],d3=1-q3[I]-q3[J];if(d2>0&&d3>0)s+=p[I]*q2[J]/d2*q3[K]/d3}
  out.set(a+'-'+b+'-'+c,s)}
 return out}
function oddsOf(h){const e=edits[R.id]?.[h.num];return e?+e:(h.odds_real||h.odds)}
const RATE={win:.80,place:.80,wakuren:.775,quin:.775,wide:.775,trio:.75,exacta:.75,trif:.725};
const BETN={win:'単勝',place:'複勝',wakuren:'枠連',quin:'馬連',wide:'ワイド',trio:'3連複',exacta:'馬単',trif:'3連単'};
const ORD=t=>t==='exacta'||t==='trif',KN=t=>t==='trio'||t==='trif'?3:2;
function probs(p){
 p=norm(p);const n=p.length,q2=norm(p.map(x=>x**0.81)),q3=norm(p.map(x=>x**0.65));
 const trio=trioMatrix(p),place=new Array(n).fill(0),wide=new Map(),quin=new Map();
 for(const[k,v]of trio){const[a,b,c]=k.split('-').map(Number);place[a]+=v;place[b]+=v;place[c]+=v;
  for(const pr of[a+'-'+b,a+'-'+c,b+'-'+c])wide.set(pr,(wide.get(pr)||0)+v)}
 for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)quin.set(i+'-'+j,p[i]*q2[j]/(1-q2[i])+p[j]*q2[i]/(1-q2[j]));
 const exacta=new Map(),trif=new Map();
 for(let i=0;i<n;i++)for(let j=0;j<n;j++){if(i===j)continue;const e=p[i]*q2[j]/(1-q2[i]);exacta.set(i+'>'+j,e);
  for(let k=0;k<n;k++){if(k===i||k===j)continue;const d=1-q3[i]-q3[j];if(d>0)trif.set(i+'>'+j+'>'+k,e*q3[k]/d)}}
 return{win:p,place,quin,wide,trio,exacta,trif}}
function compute(){
 const hs=R.horses;R._P=probs(hs.map(h=>h.p));R._M=probs(hs.map(h=>1/Math.max(oddsOf(h),1.0)));
 R._pm=R._P.trio;R._mm=R._M.trio;
 const wk=P=>{const m=new Map();for(const[k,v]of P.exacta){const[i,j]=k.split('>').map(Number),a=hs[i].waku,b=hs[j].waku;if(!a||!b)continue;const key=Math.min(a,b)+'-'+Math.max(a,b);m.set(key,(m.get(key)||0)+v)}return m};
 R._P.wakuren=wk(R._P);R._M.wakuren=wk(R._M);
}
function pOf(t,k){const P=R._P[t];return Array.isArray(P)?P[+k]:P.get(k)}
function oddsFor(t,k){
 const hs=R.horses;
 if(t==='win')return{o:oddsOf(hs[+k]),src:edits[R.id]?.[hs[+k].num]||hs[+k].odds_real?'実':'予'};
 if(t==='trio'&&R.trio_odds){const nk=k.split('-').map(i=>hs[+i].num).sort((x,y)=>x-y).join('-');if(R.trio_odds[nk])return{o:R.trio_odds[nk],src:'実'}}
 const M=R._M[t],m=Array.isArray(M)?M[+k]:M.get(k);
 return{o:Math.min(t==='trif'?99999:9999,Math.max(t==='place'?1.1:1.2,RATE[t]/m)),src:'予'}}
function trioOdds(k){return oddsFor('trio',k)}

  <p class="lead">AI勝率は、オッズや人気を使わずに、10年以上分の重賞データ（戦績・距離とコースの適性・騎手・血統・枠・脚質）から出した確率です。予想オッズの欄は書き換えられます。期待値＝AI勝率×オッズで、1.00を超えると黒地で示します。馬名を押すと、過去10走の詳細・位置取りの推移・条件別成績・対戦・予想の根拠が開きます。</p>
  <div class="tbl-scroll"><table class="main" id="tbl"></table></div>
 </div><aside class="calc" id="calc" aria-label="期待値の計算"></aside></div></section>
 <section id="s-heat"><h3>${icon('gate')}組み合わせマップ（馬連・ワイド）</h3>

  <div class="strip-tools"><div class="tog" role="group" aria-label="券種"><button data-h="quin" aria-pressed="true">馬連</button><button data-h="wide" aria-pressed="false">ワイド</button></div><span class="note" id="heatinfo" style="margin:0" aria-live="polite"></span></div>
  <div class="tbl-scroll"><table class="heat" id="heat"></table></div></section>
 <section id="s-bias"><h3>${icon('gate')}このコースの有利不利</h3>
  <p class="lead">${esc(r.course.label)}で行われた重賞 ${r.course.races}レース（${esc(r.course.from)}〜${esc(r.course.to)}）の集計です。指数は「頭数から見た平均の3着内率」を1.00とした比率で、標本が少ないほど1.00に寄せています。破線が平均です。</p>
  <div id="now"></div>
  <div class="bias" id="bias"></div></section>

 <section id="s-hist" class="hist"><h3>${icon('hist')}過去の結果</h3><p class="lead">同じレースの過去の上位3頭です（JRA公式の成績から）。通過順は各コーナーの順位です。</p><div id="hist"></div></section>
 <section id="s-method" class="method"><h3 style="color:var(--ink)">${icon('info')}この予想について</h3><div id="method"></div></section>`;
 document.querySelectorAll('.tog button[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll('.tog button[data-v]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===view));drawStrip()});
 renderPace();renderScn();renderTable();renderCalc();renderHeat();renderBias();renderNow();renderH2H();renderHist();renderMethod();
 document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{heatT=b.dataset.h;document.querySelectorAll('[data-h]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.h===heatT));renderHeat()});
 const s=$('#strip');if(window._ro)window._ro.disconnect();window._ro=new ResizeObserver(drawStrip);window._ro.observe(s);

function renderPace(){
 const p=R.pace,lab={H:'ハイ',M:'ミドル',S:'スロー'},best=['H','M','S'].sort((a,b)=>p[b]-p[a])[0];
 $('#fc').innerHTML=`<div class="big">${lab[best]}ペース寄り</div>
 <div class="why">逃げ候補 <span class="n">${p.n_front}</span>頭、先行 <span class="n">${p.n_lead}</span>頭。${esc(p.comment||'')}</div>
 <div class="seg" role="img" aria-label="ハイ${pct(p.H,0)} ミドル${pct(p.M,0)} スロー${pct(p.S,0)}">
 ${['H','M','S'].map(k=>`<div class="${k}" style="width:${Math.max(p[k]*100,14)}%">${lab[k]} ${pct(p[k],0)}</div>`).join('')}</div>
 <p class="note">ペースは前半3ハロンと上がり3ハロンの差で分類しています（差が1秒超でハイ・スロー）。</p>`;
}
function drawStrip(){
 const box=$('#strip');if(!box)return;const s=box.querySelector('svg'),Wd=box.clientWidth,H=box.clientHeight;
 const hs=R.horses,n=hs.length,padL=Wd<520?28:54,padR=Wd<520?30:70,top=44,bot=H-30,lanes=6;
 const key=view==='early'?'early':'c4';
 const ranks=hs.map(h=>h.pos[key]);
 const pl=[];
 const order=hs.map((h,i)=>i).sort((a,b)=>ranks[a]-ranks[b]);
 const rad=Math.max(Wd<520?9.5:11,Math.min(15,(Wd-padL-padR)/n*0.62));
 for(const i of order){
  const h=hs[i],x=padL+(Wd-padL-padR)*(1-(ranks[i]-1)/Math.max(n-1,1));
  let lane=Math.min(lanes-1,Math.round((h.lane??0.5)*(lanes-1)));
  while(pl.some(q=>Math.abs(q.x-x)<rad*2.1&&q.lane===lane))lane++;
  pl.push({x,lane,i});
 }
 const maxLane=Math.max(lanes,...pl.map(q=>q.lane+1)),ly=l=>top+14+(bot-top-28)*(l/(maxLane-1));
 const zone=['逃げ','先行','差し','追込'];
 let g=`<line x1="${padL-20}" y1="${top}" x2="${Wd-12}" y2="${top}" stroke="var(--strong)" stroke-width="3"/>
 <text x="${padL-20}" y="${top-10}" font-size="12" fill="var(--sub)">内ラチ</text>
 <line x1="${padL-20}" y1="${bot}" x2="${Wd-12}" y2="${bot}" stroke="var(--rule)" stroke-width="1.5"/>
 <path d="M${Wd-48} ${top-14}h30m-7 -5l7 5-7 5" stroke="var(--strong)" stroke-width="1.6" fill="none"/>
 <text x="${Wd-56}" y="${top-10}" font-size="12" text-anchor="end" fill="var(--sub)">進行方向</text>
 <text x="${Wd-padR+10}" y="${bot+20}" font-size="12" fill="var(--sub)" text-anchor="middle">先頭</text>
 <text x="${padL}" y="${bot+20}" font-size="12" fill="var(--sub)" text-anchor="middle">最後方</text>`;
 const mk={};[...hs.keys()].sort((a,b)=>hs[b].p-hs[a].p).slice(0,3).forEach((i,k)=>mk[i]=['◎','○','▲'][k]);
 for(const q of pl){
  const h=hs[q.i],y=ly(q.lane),w=h.waku||0,m=mk[q.i];
  const fill=w?`var(--g${w})`:'var(--soft)',tc=w&&![1,5,7,8].includes(w)?'#fff':(w?'#000':'var(--ink)');
  g+=`<g class="hz" style="transform:translate(${q.x}px,${y}px)"><title>${esc(h.num)} ${esc(h.name)}（${esc(STYLE[h.style]??'脚質不明')}）AI勝率${pct(h.p)}</title>
  ${m?`<circle r="${rad+4.5}" fill="none" stroke="var(--strong)" stroke-width="2.4"/>`:''}
  <circle r="${rad}" fill="${fill}" stroke="${w===1||!w?'var(--strong)':'light-dark(#000,#ddd)'}" stroke-width="1.4" ${h.known?'':'stroke-dasharray="3 3"'}/>
  <text y="5" text-anchor="middle" font-family="Barlow Semi Condensed,sans-serif" font-weight="700" font-size="${rad*1.05}" fill="${tc}">${esc(h.num)}</text></g>`;
 }
 s.innerHTML=g;
}
function renderTable(){
 const hs=R.horses.map((h,i)=>({...h,_i:i,_o:oddsOf(h),_ev:h.p*oddsOf(h)}));
 const get={num:h=>h.num,p:h=>h.p,p3:h=>h.p3,o:h=>h._o,ev:h=>h._ev,st:h=>h.style??9}[sortKey];
 hs.sort((a,b)=>(get(a)-get(b))*sortDir);
 const th=(k,l,cls='')=>`<th class="${cls}"><button data-k="${k}" ${sortKey===k?`aria-sort="${sortDir<0?'descending':'ascending'}"`:''}>${l}${sortKey===k?icon('sort'):''}</button></th>`;
 const maxp=Math.max(...hs.map(h=>h.p));
 const rows=hs.map(h=>{const ed=edits[R.id]?.[h.num];return `
 <tr class="h" data-i="${h._i}" tabindex="0" aria-haspopup="dialog">
  <td class="c-mk mark">${esc(h.mark||'')}</td>
  <td class="c-g"><span class="gate w${h.waku||0}">${esc(h.num)}</span></td>
  <td class="c-nm nm"><b>${esc(h.name)}</b><small>${esc(h.sexage)} ${f1(h.kinryo)}kg 父${esc(h.sire||'–')}<span class="only-s"> ${esc(h.jockey)} ${esc(STYLE[h.style]??'')}</span></small></td>
  <td class="c-jk">${esc(h.jockey)}</td>
  <td class="c-st">${esc(STYLE[h.style]??'–')}</td>
  <td class="c-p r"><span class="cell-l">AI勝率</span><span class="pbar"><span class="hide-s" style="width:${Math.round(h.p/maxp*44)}px"></span><b class="n">${pct(h.p)}</b></span></td>
  <td class="c-p3 r"><span class="cell-l">3着内</span><span class="n">${pct(h.p3,0)}</span></td>
  <td class="c-o r"><span class="cell-l">予想オッズ</span><input class="odds ${ed?'edited':''}" inputmode="decimal" aria-label="${esc(h.name)}の単勝オッズ" data-num="${h.num}" value="${f1(h._o)}"></td>
  <td class="c-ev r"><span class="cell-l">期待値</span><span class="ev ${h._ev>=1?'hi':''}">${f2(h._ev)}</span></td>
 </tr>`}).join('');
 $('#tbl').innerHTML=`<thead><tr><th></th>${th('num','馬番')}<th>馬名</th><th class="c-jk">騎手</th>${th('st','脚質')}${th('p','AI勝率','r')}${th('p3','3着内','r')}${th('o','予想オッズ','r')}${th('ev','期待値','r')}</tr></thead><tbody>${rows}</tbody>`;
 $('#tbl').querySelectorAll('th button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=k==='num'||k==='st'||k==='o'?1:-1}renderTable()});
 $('#tbl').querySelectorAll('tr.h').forEach(tr=>{
  const tog=e=>{if(e.target.closest('input'))return;openHorse(+tr.dataset.i,tr)};
  tr.onclick=tog;tr.onkeydown=e=>{if(e.target.closest('input'))return;if(e.key==='Enter'||e.key===' '){e.preventDefault();tog(e)}};
 });
 $('#tbl').querySelectorAll('input.odds').forEach(inp=>{
  inp.onchange=()=>{const v=parseFloat(inp.value);(edits[R.id]??={});if(v>=1)edits[R.id][inp.dataset.num]=v;else delete edits[R.id][inp.dataset.num];store.set('jp-odds',edits);compute();renderTable();renderCalc();renderHeat()};
  inp.onclick=e=>e.stopPropagation();
 });
}

function gateB(h,sm){return `<span class="gate w${h.waku||0}"${sm?' style="width:22px;height:22px;font-size:13px"':''}>${esc(h.num)}</span>`}
const byNum=n=>R.horses.find(h=>h.num===n);
function renderScn(){
 const hs=[...R.horses].sort((a,b)=>b.p-a.p);
 const cell=h=>k=>{const v=h.scn?.[k]??h.p,r=v/h.p-1;return `<td class="r"><b class="n">${pct(v)}</b><small class="n ${r>=0.03?'up':''}">${r>=0?'+':''}${(r*100).toFixed(0)}%</small></td>`};
 const row=h=>`<tr><td class="nm">${gateB(h,1)} ${esc(h.name)}</td><td>${esc(STYLE[h.style]??'–')}</td><td class="r n">${pct(h.p)}</td>${['H','M','S'].map(cell(h)).join('')}</tr>`;
 const mv=k=>{const x=[...hs].filter(h=>h.style!=null).sort((a,b)=>(b.scn[k]/b.p)-(a.scn[k]/a.p))[0];return x?`${PACE[k]}なら ${x.num}番 ${esc(x.name)}（${STYLE[x.style]}）`:''};
 $('#scn').innerHTML=`<caption class="note" style="text-align:left;caption-side:top;margin-bottom:8px">いちばん上がる馬：${['H','M','S'].map(mv).filter(Boolean).join('／')}</caption>
 <thead><tr><th>馬</th><th>脚質</th><th class="r">AI勝率</th><th class="r">ハイなら（${pct(R.pace.H,0)}）</th><th class="r">ミドルなら（${pct(R.pace.M,0)}）</th><th class="r">スローなら（${pct(R.pace.S,0)}）</th></tr></thead>
 <tbody>${hs.slice(0,8).map(row).join('')}</tbody><tbody class="more" hidden>${hs.slice(8).map(row).join('')}</tbody>`;
 if(hs.length>8){const b=document.createElement('button');b.className='btn';b.style.marginTop='10px';b.textContent=`残り${hs.length-8}頭も表示`;b.onclick=()=>{$('#scn .more').hidden=false;b.remove()};$('#scn').after(b)}
}
function renderHeat(){
 const el=$('#heat');if(!el)return;const hs=R.horses,ord=[...hs.keys()].sort((a,b)=>hs[a].num-hs[b].num),t=heatT;
 let mx=0;const ev={};
 for(let a=0;a<ord.length;a++)for(let b=a+1;b<ord.length;b++){const i=Math.min(ord[a],ord[b]),j=Math.max(ord[a],ord[b]),k=i+'-'+j,o=oddsFor(t,k).o,p=pOf(t,k);ev[k]=[p*o,p,o];mx=Math.max(mx,p)}
 const sh=p=>{const x=Math.min(1,p/mx);return `background:color-mix(in srgb,var(--strong) ${Math.round(x*92)}%,var(--bg));color:${x>0.5?'var(--inv)':'var(--ink)'}`};
 el.innerHTML=`<thead><tr><th></th>${ord.map(i=>`<th class="c">${gateB(hs[i],1)}</th>`).join('')}</tr></thead><tbody>${ord.map((i,ri)=>`<tr><th class="c">${gateB(hs[i],1)}</th>${ord.map((j,ci)=>{if(ci<=ri)return '<td class="x"></td>';const k=Math.min(i,j)+'-'+Math.max(i,j),[v,p,o]=ev[k];
  return `<td><button class="hc ${v>=1?'on':''}" style="${sh(p)}" data-k="${k}" aria-label="${hs[i].num}-${hs[j].num} 確率${pct(p)} 期待値${f2(v)}">${p>=0.0995?(p*100).toFixed(0):(p*100).toFixed(1)}</button></td>`}).join('')}</tr>`).join('')}</tbody>`;
 el.querySelectorAll('.hc').forEach(b=>b.onclick=()=>{const[v,p,o]=ev[b.dataset.k];$('#heatinfo').textContent=`${BETN[t]} ${numsOf(b.dataset.k)}：当たる確率${pct(p)}、予想オッズ${f1(o)}倍、期待値${f2(v)}`});
 $('#heatinfo').textContent='マスを押すと詳しい数字が出ます';
}

 $('#now').innerHTML=`<div class="nowbox"><h4>${icon('pos')}今開催の馬場傾向（${esc(R.venue+R.surface)}・${esc(b.days.join('、'))}の${b.races}レース、最終日の馬場${esc(b.cond||'')}）</h4>
 <p class="s">このレースと同じ開催の、前の日までの全クラスの結果です。距離はまちまちで、数日分の小さな標本です。序盤の位置はレースの結果の数字なので、当日の傾向をつかむ目安として見てください。</p>

function dBody(h){

function allocate(odds,budget,margin,prio){
 let idx=odds.map((_,i)=>i);

  const s={};idx.forEach(i=>s[i]=100);let ch=true,S=0;
  for(let it=0;it<200&&ch;it++){S=idx.reduce((a,i)=>a+s[i],0);ch=false;

  S=idx.reduce((a,i)=>a+s[i],0);
  if(!ch&&S<=budget){const f=budget/S,t={};idx.forEach(i=>t[i]=Math.floor(s[i]*f/100)*100);const T=idx.reduce((a,i)=>a+t[i],0);const ok=idx.every(i=>t[i]*odds[i]*margin[i]>=T);return odds.map((_,i)=>((ok?t:s)[i]||0))}
  const drop=idx.reduce((a,b)=>((prio?prio[b]:0)<(prio?prio[a]:0)||((prio?prio[b]:0)===(prio?prio[a]:0)&&odds[b]<odds[a]))?b:a);
  idx=idx.filter(i=>i!==drop)}

  rows=[s1,s2,s3];for(const x of s1)for(const y of s2){if(y===x)continue;for(const z of s3){if(z===x||z===y)continue;bets.push(['trif',ok_([x,y,z])])}}}

function combos(t){
 const c=calc,k=KN(t),ord=ORD(t),idx=a=>ord?a.join('>'):[...a].sort((x,y)=>x-y).join('-');let keys=[];
 if(t==='wakuren'){const cnt={};R.horses.forEach(h=>cnt[h.waku]=(cnt[h.waku]||0)+1);const W2=(a,b)=>Math.min(a,b)+'-'+Math.max(a,b);
  if(c.mode==='nagashi'&&c.wAxis!=null)[...c.wPart].forEach(b=>{if(b!==c.wAxis||cnt[b]>1)keys.push(W2(c.wAxis,b))});
  if(c.mode==='box'){const bs=[...c.wBox];for(let x=0;x<bs.length;x++)for(let y=x;y<bs.length;y++){if(x===y&&cnt[bs[x]]<2)continue;keys.push(W2(bs[x],bs[y]))}}
  if(c.mode==='top'){const P=R._P.wakuren;keys=[...P.keys()].sort((a,b)=>P.get(b)-P.get(a)).slice(0,PICK[t])}
  return [...new Set(keys)].filter(x=>R._P.wakuren.has(x))}
 const perm=a=>a.length<=1?[a]:a.flatMap((x,i)=>perm([...a.slice(0,i),...a.slice(i+1)]).map(r=>[x,...r]));
 if(c.mode==='nagashi'&&c.axis!=null){const ps=[...c.partners].filter(i=>i!==c.axis);
  if(k===2)ps.forEach(a=>keys.push(idx([c.axis,a])));
  else for(let a=0;a<ps.length;a++)for(let b=0;b<ps.length;b++){if(a===b||(!ord&&b<a))continue;keys.push(idx([c.axis,ps[a],ps[b]]))}}
 if(c.mode==='form'&&k===3){const A=[...c.f1],B=[...c.f2],C=[...c.f3];
  for(const x of A)for(const y of B)for(const z of C){if(x===y||x===z||y===z)continue;keys.push(idx(ord?[x,y,z]:[x,y,z]))}}
 if(c.mode==='box'){const bs=[...c.box];
  const sets=[];if(k===2){for(let a=0;a<bs.length;a++)for(let b=a+1;b<bs.length;b++)sets.push([bs[a],bs[b]])}
  else for(let a=0;a<bs.length;a++)for(let b=a+1;b<bs.length;b++)for(let d=b+1;d<bs.length;d++)sets.push([bs[a],bs[b],bs[d]]);
  sets.forEach(x=>(ord?perm(x):[x]).forEach(y=>keys.push(idx(y))))}
 if(c.mode==='top'){const P=R._P[t];keys=[...P.keys()].sort((a,b)=>P.get(b)-P.get(a)).slice(0,PICK[t])}
 return [...new Set(keys)]}

function oddsStamp(){return R.odds_time?`オッズ：JRAの発売中オッズ（${R.odds_time}時点）`:'オッズ：発売前の推定（レース当日は1時間ごとに更新します）'}
async function refreshOdds(){
 const m=$('#rfmsg');if(m)m.textContent='確認しています…';
 try{
  const r=await fetch(new URL('week.json',location.href).href+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;
  const nw=await r.json(),x=nw.races.find(q=>q.id===R.id);if(!x)throw 0;
  const changed=(x.odds_time||'')!==(R.odds_time||'')||JSON.stringify(x.horses.map(h=>h.odds_real||h.odds))!==JSON.stringify(R.horses.map(h=>h.odds_real||h.odds));
  if(changed){x.horses.forEach(h=>{const me=R.horses.find(q=>q.num===h.num);if(me){me.odds=h.odds;me.odds_real=h.odds_real}});R.trio_odds=x.trio_odds;R.odds_time=x.odds_time;R.odds_note=x.odds_note;W.generated_at=nw.generated_at;compute();renderTable();renderCalc();renderHeat();$('#rfmsg').textContent=`更新しました。${oddsStamp()}`}
  else $('#rfmsg').textContent=`新しいオッズはまだありません。${oddsStamp()}`;
 }catch(e){if(m)m.textContent='このページでは更新できません。https://quato-9646.github.io/ で開くと更新できます。'}}
function renderCalc(){
 const hs=R.horses,c=calc,t=c.type;
 if(t==='plan'){
  $('#calc').innerHTML=`<h3>${icon('calc')}買い方と期待値</h3>
  <div class="tog wrap" role="group" aria-label="券種">${['plan','win','place','wakuren','quin','exacta','wide','trio','trif'].map(x=>`<button data-t="${x}" aria-pressed="${t===x}" ${x==='wakuren'&&!R.drawn?'disabled title="枠順の確定後に使えます"':''}>${x==='plan'?'おすすめ':BETN[x]}</button>`).join('')}</div>
  ${renderPlanBody()}
  <div class="row" style="margin-top:12px"><button class="btn solid" id="refresh">${icon('reset')}最新のオッズに更新</button><button class="btn" id="reset">オッズを元に戻す</button></div><p class="note" id="rfmsg" aria-live="polite" style="margin:6px 0 0">${esc(oddsStamp())}</p>
  <p class="warn">参考：1頭軸流しと3連単フォーメーションの考え方。確率はAIの予想から、何度もレースを試算して出しています（毎回わずかに変わります）。「予」はオッズ発売前の推定です。的中や利益を保証するものではありません。</p>`;
  const el=$('#calc');
  el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{c.type=b.dataset.t;renderCalc()});
  el.querySelectorAll('[data-k2]').forEach(b=>b.onclick=()=>{c.kind=b.dataset.k2;renderCalc()});
  $('#bud').onchange=e=>{c.budget=+e.target.value;renderCalc()};
  $('#reset').onclick=()=>{delete edits[R.id];store.set('jp-odds',edits);compute();renderTable();renderCalc();renderHeat()};
  $('#refresh').onclick=refreshOdds;
  return}
 const chip=(i,on,grp)=>`<button data-g="${grp}" data-i="${i}" aria-pressed="${on}" aria-label="${esc(hs[i].num)}番 ${esc(hs[i].name)}">${esc(hs[i].num)}</button>`;
 const ord=[...hs.keys()].sort((a,b)=>hs[a].num-hs[b].num);
 let rows,note='',sel='';
 if(t==='win'||t==='place'){
  rows=ord.map(i=>{const o=oddsFor(t,i);return{k:String(i),p:pOf(t,i),o:o.o,src:o.src}}).map(x=>({...x,ev:x.p*x.o})).sort((a,b)=>b.ev-a.ev);
  rows=rows.filter(x=>x.p>=(t==='win'?0.04:0.15));note=`当たる確率が${t==='win'?'4':'15'}%以上で、期待値1.00以上の${BETN[t]}（${rows.filter(x=>x.ev>=1).length}頭）をすべて買った場合`;
 }else{
  sel=`<div class="tog modes" role="group" aria-label="買い方" style="margin-top:10px">
   <button data-m="top" aria-pressed="${c.mode==='top'}">当たりやすい順${PICK[t]}点</button><button data-m="nagashi" aria-pressed="${c.mode==='nagashi'}">${ORD(t)?'1着固定流し':'軸1頭流し'}</button><button data-m="box" aria-pressed="${c.mode==='box'}">ボックス</button>${KN(t)===3?`<button data-m="form" aria-pressed="${c.mode==='form'}">フォーメーション</button>`:''}</div>
  ${t==='wakuren'?(()=>{const ws=[...new Set(hs.map(h=>h.waku))].filter(Boolean).sort((a,b)=>a-b);const wc=(w,on,g)=>`<button data-gw="${g}" data-w="${w}" aria-pressed="${on}" class="wchip"><span class="gate w${w}" style="width:24px;height:24px;font-size:14px">${w}</span></button>`;
   return c.mode==='nagashi'?`<label>軸の枠</label><div class="chips">${ws.map(w=>wc(w,c.wAxis===w,'axis')).join('')}</div><label>相手の枠（同じ枠を選ぶとゾロ目）</label><div class="chips">${ws.map(w=>wc(w,c.wPart.has(w),'partner')).join('')}</div>`:c.mode==='box'?`<label>選ぶ枠（2つ以上）</label><div class="chips">${ws.map(w=>wc(w,c.wBox.has(w),'box')).join('')}</div>`:''})():''}
  ${t!=='wakuren'&&c.mode==='nagashi'?`<label>${ORD(t)?'1着に固定する馬':'軸（1頭）'}</label><div class="chips">${ord.map(i=>chip(i,c.axis===i,'axis')).join('')}</div>
   <label>${ORD(t)?(KN(t)===3?'2・3着の相手（複数）':'2着の相手（複数）'):'相手（複数）'}</label><div class="chips">${ord.map(i=>chip(i,c.partners.has(i)&&i!==c.axis,'partner')).join('')}</div>`:''}
  ${KN(t)===3&&c.mode==='form'?[['f1',ORD(t)?'1着':'1列目'],['f2',ORD(t)?'2着':'2列目'],['f3',ORD(t)?'3着':'3列目']].map(([g,l])=>`<label>${l}（複数可）</label><div class="chips">${ord.map(i=>chip(i,c[g].has(i),g)).join('')}</div>`).join('')+`<p class="note">${ORD(t)?'1着・2着・3着に置く馬をそれぞれ選びます。':'3列から1頭ずつ選んだ組み合わせを買います（同じ組み合わせは1点にまとめます）。'}</p>`:''}
  ${t!=='wakuren'&&c.mode==='box'?`<label>選ぶ馬（${KN(t)}頭以上）</label><div class="chips">${ord.map(i=>chip(i,c.box.has(i),'box')).join('')}</div>`:''}
  ${c.mode==='top'?`<p class="note">AIが当たる確率が高いと見た順に${PICK[t]}点選びます。配当が低すぎる組み合わせは買いません。</p>`:''}`;
  rows=combos(t).map(k=>{const o=oddsFor(t,k),p=pOf(t,k);return{k,p,o:o.o,src:o.src,ev:p*o.o}}).sort((a,b)=>b.p-a.p);
 }
 let buy=(t==='win'||t==='place')?rows.filter(x=>x.ev>=1):rows;
 const stake=(t==='win'||t==='place')?c.winStake:c.stake;
 let dropped=0;
 if(buy.length){const tb=Math.max(100,c.total||1000),a=allocate(buy.map(x=>x.o),tb,buy.map(x=>MARGIN(x.src)),buy.map(x=>x.p));
  buy.forEach((x,i)=>x.amt=a[i]);dropped=buy.filter(x=>!x.amt).length;buy=buy.filter(x=>x.amt>0)}
 else buy.forEach(x=>x.amt=stake);
 const inv=buy.reduce((s,x)=>s+x.amt,0),ret=buy.reduce((s,x)=>s+x.p*x.o*x.amt,0),hit=t==='place'?1-buy.reduce((s,x)=>s*(1-x.p),1):buy.reduce((s,x)=>s+x.p,0);
 const amtOf=new Map(buy.map(x=>[x.k,x.amt]));
 const lab=x=>t==='wakuren'?`<span class="fin">${x.k.split('-').map(w=>`<span class="gate w${w}" style="width:22px;height:22px;font-size:13px">${w}</span>`).join('')}</span>`:(t==='win'||t==='place')?`<span class="gate w${hs[+x.k].waku||0}">${esc(hs[+x.k].num)}</span> ${esc(hs[+x.k].name)}`:`<span class="n">${numsOf(x.k)}</span>`;
 $('#calc').innerHTML=`<h3>${icon('calc')}期待値の計算</h3>
 <div class="tog wrap" role="group" aria-label="券種">${['plan','win','place','wakuren','quin','exacta','wide','trio','trif'].map(x=>`<button data-t="${x}" aria-pressed="${t===x}" ${x==='wakuren'&&!R.drawn?'disabled title="枠順の確定後に使えます"':''}>${x==='plan'?'おすすめ':BETN[x]}</button>`).join('')}</div>
 ${sel}
 <label for="tt">合計の予算</label><div class="row"><input id="tt" type="number" min="100" step="100" value="${c.total||1000}"><span>円</span></div>
 <div class="out">${note?`<div class="cap">${note}</div>`:''}<div class="res">${inv?f2(ret/inv):'–'}</div><div class="cap">期待回収率（1.00で元が戻る計算）</div>
 <div class="k" style="margin-top:12px"><span>点数</span><span class="n">${buy.length}点</span><span>投資</span><span class="n">${yen(inv)}</span><span>的中確率${t==='place'?'（1頭以上）':''}</span><span class="n">${pct(hit)}</span><span>期待払戻</span><span class="n">${yen(ret)}</span></div></div>
 <div class="combos all"><table><thead><tr><th>${t==='win'||t==='place'?'馬':'組み合わせ'}</th><th class="r">確率</th><th class="r">オッズ</th><th class="r">期待値</th><th class="r">金額</th><th class="r">当たった時</th></tr></thead><tbody>${rows.map(x=>{const a=amtOf.get(x.k)||0,g=a?Math.round(a*x.o)-inv:null;return `<tr class="${a?'':'off'}"><td>${lab(x)}</td><td class="r n">${pct(x.p)}</td><td class="r n">${f1(x.o)}<small>${x.src==='実'?'':' 予'}</small></td><td class="r"><span class="ev ${x.ev>=1?'hi':''}">${f2(x.ev)}</span></td><td class="r n">${a?a.toLocaleString():'–'}</td><td class="r n">${g==null?'買わない':`<b>${plus(g)}</b>`}</td></tr>`}).join('')||'<tr><td colspan="6">馬を選ぶと組み合わせが出ます</td></tr>'}</tbody></table></div>
 <div class="row" style="margin-top:12px"><button class="btn solid" id="refresh">${icon('reset')}最新のオッズに更新</button><button class="btn" id="reset">オッズを元に戻す</button></div><p class="note" id="rfmsg" aria-live="polite" style="margin:6px 0 0">${esc(oddsStamp())}</p>
 <p class="warn">「予」はオッズ発売前の推定です（払戻率 単勝・複勝80%、枠連・馬連・ワイド77.5%、馬単・3連複75%、3連単72.5%で計算）。${R.trio_odds?'3連複はJRAの発売中オッズを使っています。':''}期待値はAIの確率が正しいと仮定した計算で、過去の検証では回収率100%を超えていません。</p>`;
 const el=$('#calc');
 el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{c.type=b.dataset.t;if(c.mode==='form'&&KN(c.type)!==3)c.mode='top';renderCalc()});
 el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{c.mode=b.dataset.m;renderCalc()});
 el.querySelectorAll('.chips button[data-gw]').forEach(b=>b.onclick=()=>{const w=+b.dataset.w,g=b.dataset.gw;
  if(g==='axis')c.wAxis=w;else if(g==='partner'){c.wPart.has(w)?c.wPart.delete(w):c.wPart.add(w)}else{c.wBox.has(w)?c.wBox.delete(w):c.wBox.add(w)}renderCalc()});
 el.querySelectorAll('.chips button[data-g]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,g=b.dataset.g;
  if(g==='axis'){c.axis=i;c.partners.delete(i)}else if(g==='partner'){c.partners.has(i)?c.partners.delete(i):c.partners.add(i)}else if(g==='f1'||g==='f2'||g==='f3'){c[g].has(i)?c[g].delete(i):c[g].add(i)}else{c.box.has(i)?c.box.delete(i):c.box.add(i)}renderCalc()});
 const st=$('#st');if(st)st.onchange=()=>{const v=Math.max(100,Math.round((+st.value||100)/100)*100);if(t==='win'||t==='place')c.winStake=v;else c.stake=v;renderCalc()};
 const tt=$('#tt');if(tt)tt.onchange=()=>{c.total=Math.max(100,Math.round((+tt.value||100)/100)*100);renderCalc()};
 $('#reset').onclick=()=>{delete edits[R.id];store.set('jp-odds',edits);compute();renderTable();renderCalc();renderHeat()};
 $('#refresh').onclick=refreshOdds;
}
function bars(rows,mine,label){
 const mx=Math.max(...rows.map(x=>x.rate),0.01)*1.15, avg=rows.length?rows.reduce((s,x)=>s+x.top3,0)/Math.max(rows.reduce((s,x)=>s+x.n,0),1):0;
 return rows.map(x=>`<div class="bar ${mine.has(x.k)?'mine':''}"><span class="lab">${label(x)}</span>
 <span class="track"><span class="fill" style="width:${x.rate/mx*100}%"></span><span class="avg" style="left:${avg/mx*100}%"></span></span>
 <span class="v">${pct(x.rate,1)}<small>${x.n}頭 指数${f2(x.idx)}</small></span></div>`).join('')}
function renderBias(){
 const c=R.course,hs=R.horses;
 const mw=new Set(hs.map(h=>h.waku)),ms=new Set(hs.map(h=>h.style));
 const tbl=(rows,kind)=>rows.length?`<table class="mini"><thead><tr><th>${kind}</th><th class="r">騎乗/頭</th><th class="r">勝</th><th class="r">3着内</th><th class="r">3着内率</th><th class="r">指数</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.name)}${x.horses?`<br><small style="color:var(--sub)">${esc(x.horses)}</small>`:''}</td><td class="r n">${x.n}</td><td class="r n">${x.win}</td><td class="r n">${x.top3}</td><td class="r n">${pct(x.rate)}</td><td class="r n"><b>${f2(x.idx)}</b></td></tr>`).join('')}</tbody></table>`:'<p class="note">このコースの重賞での記録がありません。</p>';
 $('#bias').innerHTML=`
 <div><h4>${icon('gate')}枠番別の3着内率</h4><p class="s">${c.waku_note}${R.drawn?'。太字は今回出走馬がいる枠':''}</p>${bars(c.waku,R.drawn?mw:new Set(),x=>`<span class="gate w${x.k}" style="width:22px;height:22px;font-size:13px">${x.k}</span>`)}</div>
 <div><h4>${icon('style')}脚質別の3着内率</h4><p class="s">脚質はレース前の近走の通過順から判定（結果の位置ではありません）。判定できた${pct(c.style_cov,0)}の馬で集計</p>${bars(c.style,ms,x=>STYLE[x.k])}</div>
 <div><h4>${icon('jk')}今回の騎手（${esc(R.venue+R.surface)}の重賞）</h4>${tbl(c.jockeys,'騎手')}</div>
 <div><h4>${icon('blood')}今回の父（${esc(c.blood_label)}の重賞）</h4>${tbl(c.sires,'父')}</div>`;
}
function renderHist(){
 const e=R.editions||[];
 $('#hist').innerHTML=e.length?`<div class="tbl-scroll"><table><thead><tr><th>年</th><th>場</th><th class="r">頭数</th><th>ペース</th><th>1着</th><th>2着</th><th>3着</th></tr></thead><tbody>${e.map(x=>`<tr><td class="n">${esc(x.year)}</td><td>${esc(x.venue)}</td><td class="r n">${x.n}</td><td>${esc({H:'ハイ',M:'ミドル',S:'スロー'}[x.pace]||'–')}</td>${x.top.map(t=>`<td><span class="gate w${t.waku}" style="width:22px;height:22px;font-size:13px">${t.num}</span> ${esc(t.horse)}<br><small style="color:var(--sub)">${t.pop}人気 通過${esc(t.passage||'–')}</small></td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<p class="note">過去の同名レースが見つかりませんでした。</p>';
}
function renderMethod(){
 const b=W.backtest;
 $('#method').innerHTML=`${W.method_html}
 <h4>過去のレースでの検証（${esc(b.period)}・${b.races}レース、学習に使っていない期間）</h4>
 <div class="tbl-scroll"><table class="bt"><thead><tr><th>買い方</th><th class="r">的中</th><th class="r">的中率</th><th class="r">回収率</th><th class="r">最も大きい払戻1本を除く</th></tr></thead><tbody>${b.rows.map(x=>`<tr><td>${esc(x.label)}</td><td class="r n">${x.hits}/${x.races}</td><td class="r n">${pct(x.hit_rate)}</td><td class="r n"><b>${pct(x.roi)}</b></td><td class="r n">${pct(x.roi_ex1)}</td></tr>`).join('')}</tbody></table></div>
 <p>${esc(b.note)}</p>
 ${W.plan_bt2?`<h4>おすすめの買い方の検証（同じ期間、実際の払戻）</h4><div class="tbl-scroll"><table class="bt"><thead><tr><th>買い方</th><th class="r">1レースの金額</th><th class="r">的中率</th><th class="r">回収率</th><th class="r">最も大きい払戻1本を除く</th></tr></thead><tbody>${KINDS.map(([k,l])=>{const x=W.plan_bt2[k];return x?`<tr><td>${l}</td><td class="r n">${x.budget.toLocaleString()}円</td><td class="r n"><b>${pct(x.hit_rate)}</b></td><td class="r n"><b>${pct(x.roi)}</b></td><td class="r n">${pct(x.roi_ex1)}</td></tr>`:`<tr><td>${l}</td><td colspan="4">過去の払戻データなし</td></tr>`}).join('')}</tbody></table></div>
 <p>軸は、AI勝率の上位3頭のうち3着以内に来る確率がいちばん高い馬です。どの買い方も回収率は100%に届いていません。</p>`:''}
 <h4>注意</h4><p>この予想は個人の分析で、的中や利益を保証するものではありません。馬券は自己責任で、無理のない範囲でお楽しみください。勝馬投票券（馬券）は20歳未満の方は購入できません。データはJRA公式サイト（www.jra.go.jp）の成績から集計しています。</p>`;
}
