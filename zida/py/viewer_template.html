<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>麻雀AI「ZIDA」のレビュー</title>
<style>
:root{--bg:#f4f5f2;--card:#fff;--ink:#1c2420;--mute:#66706a;--line:#dfe3dd;--acc:#1f6b4a;--warn:#b4531a;--bad:#b3261e;--ok:#1f6b4a;--chip:#e9eee8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--card:#1b2220;--ink:#e8ede9;--mute:#9aa6a0;--line:#2b3531;--acc:#5cc59a;--warn:#e69a5e;--bad:#f2857d;--ok:#5cc59a;--chip:#26302c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121715;--card:#1b2220;--ink:#e8ede9;--mute:#9aa6a0;--line:#2b3531;--acc:#5cc59a;--warn:#e69a5e;--bad:#f2857d;--ok:#5cc59a;--chip:#26302c;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding-bottom:84px}
.wrap{max-width:860px;margin:0 auto;padding:12px 16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
select{max-width:100%}
select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button:disabled{opacity:.4;cursor:default}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.pl{border-radius:8px;padding:4px 2px;background:var(--chip);min-width:0;cursor:pointer;border:2px solid transparent;font:inherit;color:inherit}
.pl.me{border-color:var(--acc)}
.pl small{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl b{font-size:16px;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:11px;border-radius:4px;padding:0 5px;margin-left:3px;color:#fff;background:var(--mute)}
.badge.r{background:var(--bad)}.badge.o{background:var(--warn)}
.hint{color:var(--mute);font-size:12px}
/* 牌の画像(切り出し済みシート 10列×4段、1枚 64×100) */
.sp{background-image:url(__TILES__);background-repeat:no-repeat;flex:none;display:block}
/* 雀卓 */
#tw{width:100%;max-width:820px;margin:0 auto 10px;position:relative;overflow:hidden}
#stage{width:1024px;height:1024px;position:absolute;left:0;top:0;transform-origin:0 0;background:url(__TABLE__) 0 0/1024px 1024px no-repeat;color:#fff;font-family:inherit}
.abs{position:absolute}
.hf{position:absolute;width:505px;height:55px}
.hf .sp{position:absolute}
.rv{position:absolute;left:0;top:0;width:1024px;height:1024px;transform-origin:512.5px 512.5px;pointer-events:none}
.rv>div{position:absolute;left:405px;top:620px}
.rv .row{display:flex;align-items:flex-end;height:56px}
.rv .row+.row{margin-top:-4px}
.rv .side{position:relative;width:56px;height:35.83px;flex:none}
.rv .side .sp{position:absolute;left:10.1px;top:-10.1px;transform:rotate(90deg)}
.rv .called{opacity:.35}
.sp.tsumo{filter:grayscale(1) brightness(.78)}
.mr{position:absolute;right:0;bottom:0;display:flex;flex-direction:row-reverse;align-items:flex-end;gap:5px}
.mg{display:flex;align-items:flex-end}
.mg .sd{position:relative;flex:none}
.hf .mg .sp{position:relative}
.hf .mg .sd .sp{position:absolute}
.plate{position:absolute;width:188px;text-align:center;background:rgba(0,0,0,.42);border-radius:14px;padding:6px 4px;border:3px solid transparent;cursor:pointer;color:#fff;font:inherit;line-height:1.25}
.plate.v{border-color:#ffd24d}
.plate .nm{font-size:27px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.plate .sc{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;display:block}
.plate .wd{font-size:24px;display:block;opacity:.9}
.plate .tg{display:inline-block;font-size:21px;border-radius:6px;padding:0 8px;margin:0 2px;background:#c0392b}
.plate .tg.o{background:#d98324}
.info{position:absolute;font-size:32px;line-height:1.35;text-shadow:0 1px 3px rgba(0,0,0,.6)}
/* 手牌カード */
.hand{display:flex;gap:2px;flex-wrap:wrap;align-items:flex-end;padding:6px 0}
.col{display:flex;flex-direction:column;align-items:center;gap:3px}
.col .sp{border-radius:4px}
.pb{width:38px;height:30px;background:var(--chip);border-radius:3px;position:relative;overflow:hidden}
.pb i{position:absolute;left:0;right:0;bottom:0;background:var(--acc);opacity:.75}
.pb em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:700}
.col.act .sp{outline:3px solid var(--bad);outline-offset:1px}
.col.ai .pb{outline:2px solid var(--ok)}
.tag{font-size:10px;font-weight:700;min-height:14px}
.tag.a{color:var(--bad)}.tag.b{color:var(--ok)}
.gap{width:14px}
.rtitle{font-size:18px;font-weight:700;margin:0 0 2px}
.rsub{color:var(--mute);font-size:13px;margin-bottom:10px}
.win{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.win .who{font-size:17px;font-weight:700}
.win .big{font-size:24px;font-weight:700;margin:4px 0}
.trow{display:flex;gap:2px;align-items:flex-end;flex-wrap:wrap;margin:6px 0}
.trow .grp{display:flex;gap:1px;margin-left:10px}
.yk{display:grid;grid-template-columns:auto auto;justify-content:start;gap:0 28px;font-size:14px}
.yk span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
table.pt{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.pt td,table.pt th{padding:5px 6px;border-top:1px solid var(--line);text-align:right}
table.pt th{color:var(--mute);font-weight:400;font-size:12px;border-top:0}
table.pt td:first-child,table.pt th:first-child{text-align:left}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--bad);font-weight:700}
.res{display:flex;gap:10px;flex-wrap:wrap}
.res>div{flex:1;min-width:220px;border-radius:10px;padding:8px 12px;background:var(--chip)}
.res small{color:var(--mute);display:block}
.res b{font-size:17px}
.chip{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700;color:#fff}
.chip.ok{background:var(--ok)}.chip.diff{background:var(--warn)}.chip.flag{background:var(--bad)}
h3{margin:0 0 4px;font-size:14px}
.cm p{margin:2px 0 6px}
.cm .h{color:var(--acc);font-weight:700;font-size:13px;margin-top:8px}
.cm .h.w{color:var(--warn)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:8px;justify-content:center;align-items:center}
.nav button{min-width:56px;padding:10px 8px;font-weight:700;white-space:nowrap;font-size:13px}
input[type=range]{flex:1;min-width:80px}
.broken{color:var(--mute)}
.bars .br{display:grid;grid-template-columns:30px 1fr 44px 44px;gap:8px;align-items:center;padding:2px 0}
.bars .bt{height:10px;background:var(--chip);border-radius:5px;overflow:hidden}
.bars .bt i{display:block;height:100%;background:var(--acc);opacity:.8}
.bars .br.act .bt i{background:var(--bad)}
.bars .pc{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;font-weight:700}
.bars .tg2{font-size:11px;font-weight:700}
.bars .br.act .tg2{color:var(--bad)}.bars .br.ai .tg2{color:var(--ok)}
.adbox{margin:10px 0;min-height:0;text-align:center;overflow:hidden}
.adbox small{display:block;color:var(--mute);font-size:10px;text-align:left}
@media (max-width:1099px){
  .R{display:flex;flex-direction:column}
  #resv{order:-4}#res{order:-3}#bars{order:-2}#handcard{order:-1}
  .wrap{padding:8px 10px}
  .lg{display:none}
  .card{padding:10px 10px}
}
@media (min-width:1100px){
  .wrap{max-width:1380px;padding:12px 20px}
  .cols{display:grid;grid-template-columns:minmax(0,820px) minmax(380px,1fr);gap:16px;align-items:start}
  .R{position:sticky;top:8px;max-height:calc(100vh - 84px);overflow-y:auto;padding-right:4px}
  #tw{margin-left:0}
}
</style>
</head>
<body>
<div class="wrap">
<div class="cols"><div class="L">
  <div class="bar">
    <select id="game"></select>
    <select id="round"></select>
    <button id="rev" type="button">他家の手牌を見る</button>
    <span id="pos" class="hint"></span>
  </div>
  <div class="card"><div class="scores" id="scores"></div>
    <p class="hint lg" style="margin:6px 0 0">名前を押すと、その人の視点に切り替わります。河の牌: 灰色=ツモ切り / 通常色=手出し / 薄い=鳴かれた牌。</p></div>
  <div id="tw"><div id="stage"></div></div>
  <!--AD1-->
</div><div class="R">
  <div class="card" id="resv" hidden></div>
  <div class="card" id="handcard">
    <h3><span id="hname">あなた</span>の手牌 <span class="hint">(牌の下の数字=AIがその牌を切る確率。赤枠=打牌、緑枠=AIの推奨)</span></h3>
    <div class="hand" id="hand"></div>
  </div>
  <div class="card res" id="res"></div>
  <div class="card bars" id="bars"><h3>AIの打牌確率(全候補)</h3><div id="barl"></div></div>
  <div class="card cm" id="cm"></div>
  <!--AD2-->
  <p class="hint">コメントは牌譜から学習したAIと、向聴数・受け入れ・打点・安全度の計算から作っています。判断の目安であり、正解を保証するものではありません。(表示バージョン v33)</p>
</div></div>
</div>
<div class="nav">
  <button id="pf" type="button" title="前の要確認">⏪確認</button>
  <button id="p" type="button">◀</button>
  <input type="range" id="sl" min="0" value="0">
  <button id="n" type="button">▶</button>
  <button id="nf" type="button" title="次の要確認">確認⏩</button>
</div>
<script>
const D=__DATA__;
const NAMES=D.tiles, WIND="東南西北";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
/* 牌の画像: 種類 t(0-33)、赤、裏 */
function idx(t,red,back){if(back)return 37;if(red&&(t===4||t===13||t===22))return 34+((t/9)|0);return t;}
function sp(t,w,o){o=o||{};const i=idx(t,o.red,o.back),h=w*100/64,d=document.createElement("div");
  d.className="sp"+(o.cls?" "+o.cls:"");
  d.style.cssText=`width:${w}px;height:${h}px;background-size:${w*10}px ${h*4}px;background-position:${-(i%10)*w}px ${-((i/10)|0)*h}px`;
  return d;}
/* 副露1組を描く。m={k,t:[牌番号...],s:横向きの位置,a:加槓で足した牌}。牌番号 id → 種類 id>>2、赤五は16/52/88 */
const isRed=id=>id===16||id===52||id===88;
function meldNode(m,w){const h=w*100/64,g=document.createElement("div");g.className="mg";
  m.t.forEach((id,i)=>{const back=m.k==="ankan"&&(i===0||i===3);
    const e=sp(id>>2,w,{red:isRed(id),back});
    if(i===m.s){const sd=document.createElement("div");sd.className="sd";sd.style.cssText=`width:${h}px;height:${m.a>=0?2*w:w}px`;
      e.style.cssText+=`;left:${(h-w)/2}px;top:${(m.a>=0?w:0)-(h-w)/2}px;transform:rotate(90deg)`;sd.appendChild(e);
      if(m.a>=0){const f=sp(m.a>>2,w,{red:isRed(m.a)});f.style.cssText+=`;left:${(h-w)/2}px;top:${-(h-w)/2}px;transform:rotate(90deg)`;sd.appendChild(f);}
      g.appendChild(sd);}
    else g.appendChild(e);});
  return g;}
let G=0,V=0,I=0,R=false,flat=[[],[],[],[]];
const game=()=>D.games[G];
function buildFlat(){const g=game();flat=[0,1,2,3].map(s=>{const a=[];
  g.rounds.forEach((r,ri)=>{r.steps[s].forEach((st,si)=>a.push({ri,r,s:st}));
    if(r.result)a.push({ri,r,s:null,result:r.result});});return a;});}
function setGame(){buildFlat();V=game().me;I=0;
  $("round").innerHTML=game().rounds.map((r,i)=>`<option value="${i}">${esc(r.label)}${r.broken?"(解析不可)":""}</option>`).join("");
  show();}
/* 雀卓の描画。座標は元画像(1024×1024)の位置 */
const HAND=[{cx:445,cy:807.5,a:0},{cx:797.5,cy:580,a:-90},{cx:572.5,cy:217.5,a:180},{cx:222.5,cy:444,a:90}];
const PLATE=[{x:350,y:850},{x:832,y:620},{x:340,y:30},{x:2,y:300}];
function drawStage(st){
  const stg=$("stage");stg.innerHTML="";const g=game();
  for(let k=0;k<4;k++){
    const s=(V+k)%4,H=HAND[k];
    // 河(6枚ずつで、内側の黄色い四角と同じ幅。1段目が四角に隣り合い、外側へ段が増える。3段目は残りを全部)
    const rv=document.createElement("div");rv.className="rv";rv.style.transform=`rotate(${H.a}deg)`;
    const rin=document.createElement("div");const rows=[0,1,2].map(()=>{const r=document.createElement("div");r.className="row";rin.appendChild(r);return r;});
    st.rivers[s].forEach((e,i)=>{const t=e&63,rw=35.83,called=(e>>8)&1,rch=(e>>7)&1;
      const d=sp(t,rw,{red:(e>>6)&1,cls:(e>>9)&1?"tsumo":""});let node=d;
      if(rch){node=document.createElement("div");node.className="side";node.appendChild(d);}
      if(called)node.classList.add("called");
      rows[Math.min(Math.floor(i/6),2)].appendChild(node);});
    rv.appendChild(rin);stg.appendChild(rv);
    // 手牌
    const hf=document.createElement("div");hf.className="hf";
    hf.style.cssText=`left:${H.cx-252}px;top:${H.cy-27.5}px;transform:rotate(${H.a}deg)`;
    const pitch=35.7,w=35.2;
    const redSet=new Set(s===st.me?st.hand_red:st.reds[s]);
    const hs=s===st.me?st.hand:st.hands[s];
    let x=0;
    const seen={};
    hs.forEach(t=>{const first=!seen[t];seen[t]=1;
      const e=sp(t,w,{back:!(R||s===st.me),red:first&&redSet.has(t)});e.style.left=x+"px";e.style.top="0";hf.appendChild(e);x+=pitch;});
    if(s===st.me&&st.draw!==null){const e=sp(st.draw,w,{red:st.draw_red});e.style.left=(hs.length*pitch+8)+"px";e.style.top="0";hf.appendChild(e);}
    // 副露(手牌の左端の外側)
    const ml=st.meldl[s]||[];
    if(ml.length){const mr=document.createElement("div");mr.className="mr";ml.forEach(m=>mr.appendChild(meldNode(m,28)));hf.appendChild(mr);}
    stg.appendChild(hf);
    // 名前の札
    const p=document.createElement("button");p.type="button";p.className="plate"+(s===V?" v":"");
    const P=PLATE[k];p.style.left=P.x+"px";p.style.top=P.y+"px";
    const wd=WIND[(s-st.oya+4)%4];
    p.innerHTML=`<span class="nm">${esc(g.names[s])}</span><span class="sc">${st.scores[s].toLocaleString()}</span><span class="wd">${wd}家${s===st.oya?'<span class="tg o">親</span>':''}${st.riichi_seats[s]?'<span class="tg">リーチ</span>':''}</span>`;
    p.onclick=()=>setView(s);stg.appendChild(p);
  }
  // 局の情報(左上)とドラ(右上)
  const lab=flat[V][I].r.label;
  const inf=document.createElement("div");inf.className="info";inf.style.cssText="left:20px;top:14px";
  inf.innerHTML=`${esc(lab)}<br><span style="font-size:26px">${st.junme}巡目 / 供託${st.sticks}本</span>`;stg.appendChild(inf);
  const dr=document.createElement("div");dr.className="info";dr.style.cssText="right:20px;top:14px;text-align:right";
  dr.innerHTML="ドラ<br>";const row=document.createElement("div");row.style.cssText="display:flex;gap:2px;justify-content:flex-end";
  st.dora.forEach(t=>row.appendChild(sp(t,38)));dr.appendChild(row);stg.appendChild(dr);
}
function fit(){let w=Math.min($("tw").clientWidth,820);if(innerWidth>=1100)w=Math.max(520,Math.min(w,innerHeight-290));const s=w/1024;$("stage").style.transform=`scale(${s})`;$("tw").style.height=(1024*s)+"px";}
function show(){
  const F=flat[V];
  if(!F.length){$("cm").innerHTML="<p class='broken'>この視点で評価できる打牌がありません。</p>";return;}
  I=Math.min(Math.max(I,0),F.length-1);
  const f=F[I],g=game();
  const isRes=!!f.result,s=isRes?null:f.s;
  $("sl").max=F.length-1;$("sl").value=I;$("round").value=String(f.ri);
  $("pos").textContent=`${I+1} / ${F.length}`;
  $("rev").className=R?"on":"";$("rev").textContent=R?"他家の手牌を隠す":"他家の手牌を見る";
  const oya=isRes?f.result.oya:s.oya,scs=isRes?f.result.after:s.scores;
  $("scores").innerHTML=g.names.map((n,k)=>`<button type="button" class="pl${k===V?" me":""}" data-s="${k}"><small>${["東","南","西","北"][(k-oya+4)%4]}家${k===g.me?"・自分":""}</small><b>${esc(n)}</b><small>${scs[k].toLocaleString()}</small></button>`).join("");
  document.querySelectorAll("#scores .pl").forEach(b=>b.onclick=()=>setView(+b.dataset.s));
  for(const id of ["tw","handcard","res","cm"])$(id).hidden=isRes;
  $("resv").hidden=!isRes;
  $("p").disabled=I===0;$("n").disabled=I===F.length-1;
  if(isRes){showResult(f);return;}
  drawStage(s);fit();
  const who=V===g.me?"あなた":g.names[V];
  $("hname").textContent=who;
  const h=$("hand");h.innerHTML="";
  const mk=(t,red,mark)=>{const c=document.createElement("div");c.className="col"+(mark&&t===s.actual?" act":"")+(mark&&t===s.top[0]?" ai":"");
    const tag=document.createElement("div");tag.className="tag";
    if(mark&&t===s.actual&&t===s.top[0]){tag.className="tag b";tag.textContent="一致";}
    else if(mark&&t===s.actual){tag.className="tag a";tag.textContent="打牌";}
    else if(mark&&t===s.top[0]){tag.className="tag b";tag.textContent="AI";}
    c.appendChild(tag);c.appendChild(sp(t,38,{red:red}));
    const p=s.prob[String(t)]||0,pb=document.createElement("div");pb.className="pb";
    pb.innerHTML=`<i style="height:${Math.round(p*100)}%"></i><em>${Math.round(p*100)}%</em>`;c.appendChild(pb);return c;};
  // 打牌・AI推奨の印は、ツモ牌と同じ種類ならツモ牌に、そうでなければ手牌の最初の1枚だけに付ける
  const marked=new Set();
  const markHand=t=>{if(s.draw===t)return false;if(marked.has(t))return false;marked.add(t);return true;};
  const redLeft=new Set(s.hand_red);
  s.hand.forEach(t=>{const red=redLeft.has(t);if(red)redLeft.delete(t);
    h.appendChild(mk(t,red,markHand(t)));});
  if(s.draw!==null){const gp=document.createElement("div");gp.className="gap";h.appendChild(gp);
    const c=mk(s.draw,s.draw_red,true);
    const x=document.createElement("div");x.className="hint";x.textContent="ツモ";c.appendChild(x);h.appendChild(c);}
  const a=s.actual,ai=s.top[0];
  const chip=s.match?'<span class="chip ok">AIと一致</span>':s.flag?'<span class="chip flag">要確認</span>':'<span class="chip diff">AIと違う</span>';
  const tops=s.top.map(t=>`${NAMES[t]} ${Math.round((s.prob[String(t)]||0)*100)}%`).join(" / ");
  $("res").innerHTML=`<div><small>${esc(who)}の打牌${s.riichi_now?"(リーチ宣言)":""}</small><b>${NAMES[a]}</b> <span class="hint">AI確率 ${Math.round((s.prob[String(a)]||0)*100)}%</span></div>`+
    `<div><small>AIなら</small><b>${NAMES[ai]}</b> <span class="hint">上位: ${tops}</span></div><div style="flex:0 0 auto;min-width:0">${chip}</div>`;
  const kinds=[...new Set(s.hand.concat(s.draw!==null?[s.draw]:[]))].sort((x,y)=>(s.prob[String(y)]||0)-(s.prob[String(x)]||0)||x-y);
  $("barl").innerHTML="";kinds.forEach(t=>{const p=s.prob[String(t)]||0,r=document.createElement("div");
    r.className="br"+(t===s.actual?" act":"")+(t===s.top[0]?" ai":"");
    r.appendChild(sp(t,28));
    const b=document.createElement("div");b.className="bt";b.innerHTML=`<i style="width:${Math.round(p*100)}%"></i>`;r.appendChild(b);
    const c=document.createElement("div");c.className="pc";c.textContent=(p>=0.01?Math.round(p*100):(p>0?"<1":0))+"%";r.appendChild(c);
    const g2=document.createElement("div");g2.className="tg2";g2.textContent=(t===s.actual&&t===s.top[0])?"一致":t===s.actual?"打牌":t===s.top[0]?"AI":"";r.appendChild(g2);
    $("barl").appendChild(r);});
  const fix=l=>V===g.me?l:l.replace(/あなた/g,g.names[V]);
  $("cm").innerHTML=s.comments.map(c=>{const w=/(候補|推奨なのに)/.test(c.h);
    return `<div class="h${w?" w":""}">${esc(c.h)}</div>`+c.t.map(l=>`<p>${esc(fix(l))}</p>`).join("");}).join("");
}
/* 局の結果の画面 */
const pts=n=>(n<0?"":"")+n.toLocaleString();
const sgn=d=>d>0?`<span class="pos">+${d.toLocaleString()}</span>`:d<0?`<span class="neg">${d.toLocaleString()}</span>`:"0";
function trow(win){const w=document.createElement("div");w.className="trow";
  const red=new Set(win.hand_red);win.hand.forEach(t=>{const r=red.has(t);if(r)red.delete(t);w.appendChild(sp(t,30,{red:r}));});
  (win.meldd||[]).forEach(m=>{const gp=document.createElement("div");gp.className="grp";gp.appendChild(meldNode(m,30));w.appendChild(gp);});
  if(win.win!==undefined){const gp=document.createElement("div");gp.className="grp";gp.appendChild(sp(win.win,30,{red:win.win_red}));w.appendChild(gp);}
  return w;}
function showResult(f){
  const R_=f.result,g=game(),nm=i=>esc(g.names[i]);
  const box=$("resv");box.innerHTML="";
  const head=document.createElement("div");
  const bonus=(R_.honba?`${R_.honba}本場`:"")+(R_.sticks?` 供託${R_.sticks}本`:"");
  head.innerHTML=`<p class="rtitle">${esc(R_.label)} 終局</p><div class="rsub">${R_.kind==="agari"?"和了":"流局"}${bonus?"・"+bonus.trim():""}</div>`;
  box.appendChild(head);
  if(R_.kind==="agari"){
    R_.wins.forEach(w=>{const d=document.createElement("div");d.className="win";
      const how=w.tsumo?`${nm(w.who)} のツモ和了`:`${nm(w.who)} が ${nm(w.from)} からロン`;
      const level=w.yakuman.length?"役満":(w.limit||`${w.han}飜${w.fu}符`);
      d.innerHTML=`<div class="who">${how}</div><div class="big">${w.pts.toLocaleString()}点 <span class="hint">${esc(level)}${w.limit&&!w.yakuman.length?`(${w.han}飜${w.fu}符)`:""}</span></div>`;
      d.appendChild(trow(w));
      const dr=document.createElement("div");dr.className="trow";dr.innerHTML='<span class="hint">ドラ表示牌</span>';
      w.dora.forEach(t=>dr.appendChild(sp(t,22)));
      if(w.ura.length){const u=document.createElement("span");u.className="hint";u.style.marginLeft="10px";u.textContent="裏ドラ表示牌";dr.appendChild(u);w.ura.forEach(t=>dr.appendChild(sp(t,22)));}
      d.appendChild(dr);
      const yk=document.createElement("div");yk.className="yk";
      const rows=w.yakuman.length?w.yakuman.map(n=>[n,"役満"]):w.yaku.map(y=>[y[0],y[1]+"飜"]);
      yk.innerHTML=rows.map(r=>`<span>${esc(r[0])}</span><span>${r[1]}</span>`).join("");
      d.appendChild(yk);box.appendChild(d);});
  }else{
    const d=document.createElement("div");d.className="win";
    const tp=g.names.filter((n,i)=>R_.tenpai[i]);
    d.innerHTML=`<div class="who">${esc(R_.draw)}</div><p style="margin:4px 0 0">${R_.draw==="荒牌平局"?(tp.length?"聴牌: "+tp.map(esc).join("、"):"全員ノーテン"):""}</p>`;
    box.appendChild(d);
  }
  const t=document.createElement("table");t.className="pt";
  t.innerHTML="<tr><th>プレイヤー</th><th>局の前</th><th>増減</th><th>局の後</th></tr>"+
    g.names.map((n,i)=>`<tr><td>${["東","南","西","北"][(i-R_.oya+4)%4]}家 ${esc(n)}</td><td>${R_.before[i].toLocaleString()}</td><td>${sgn(R_.delta[i])}</td><td><b>${R_.after[i].toLocaleString()}</b></td></tr>`).join("");
  box.appendChild(t);
  if(R_.final){const fz=document.createElement("p");fz.className="hint";fz.style.marginTop="10px";
    const order=[0,1,2,3].sort((a,b)=>R_.final.scores[b]-R_.final.scores[a]);
    fz.textContent="対局終了: "+order.map((i,r)=>`${r+1}位 ${g.names[i]} ${R_.final.scores[i].toLocaleString()}点(${R_.final.pt[i]>0?"+":""}${R_.final.pt[i]})`).join(" / ");box.appendChild(fz);}
}
/* 視点の切り替え: 同じ局の、いまの時点に一番近い打牌へ移る */
function setView(s){
  if(s===V)return;
  const cur=flat[V][I];if(!cur){V=s;I=0;show();return;}
  const ri=cur.ri,t=cur.result?1e9:cur.s.t,F=flat[s];
  let best=-1;
  for(let i=0;i<F.length;i++){if(F[i].ri!==ri)continue;const ti=F[i].result?1e9:F[i].s.t;
    if(cur.result){if(F[i].result)best=i;continue;}
    if(F[i].result)continue;
    if(best<0||(F[best].s.t<t&&F[i].s.t>=t)||(F[best].s.t>=t&&F[i].s.t>=t&&F[i].s.t<F[best].s.t)||(F[best].s.t<t&&F[i].s.t<t&&F[i].s.t>F[best].s.t))best=i;}
  if(best<0)best=F.findIndex(x=>x.ri>=ri);
  V=s;I=Math.max(best,0);show();
}
const go=d=>{I+=d;show();};
function jump(d){const F=flat[V];for(let i=I+d;i>=0&&i<F.length;i+=d){if(F[i].s&&F[i].s.flag){I=i;show();return;}}}
$("p").onclick=()=>go(-1);$("n").onclick=()=>go(1);$("pf").onclick=()=>jump(-1);$("nf").onclick=()=>jump(1);
$("sl").oninput=e=>{I=+e.target.value;show();};
$("round").onchange=e=>{const i=flat[V].findIndex(x=>x.ri>=+e.target.value);if(i>=0){I=i;show();}};
$("game").onchange=e=>{G=+e.target.value;setGame();};
$("rev").onclick=()=>{R=!R;show();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
window.addEventListener("resize",fit);
if(window.ResizeObserver)new ResizeObserver(fit).observe($("tw"));
$("game").innerHTML=D.games.map((g,i)=>`<option value="${i}">${esc(g.title)}</option>`).join("");
setGame();
</script>
